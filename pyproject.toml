[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontor-budget"
version = "1.0.0"
description = "CLI tool for tracking monthly income, expenses and savings rate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kontor-budget = "kontor_budget.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kontor_budget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --doctest-modules --ignore=tests"
pythonpath = ["src"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
